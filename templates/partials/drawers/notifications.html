<div class="drawer-scrim" id="notificationsScrim" data-open="false" onclick="Drawers.closeNotifications()" aria-hidden="true"></div>

<aside class="drawer" id="notificationsDrawer" data-open="false"
       role="dialog" aria-modal="true" aria-labelledby="notifTitle">
  <div class="drawer-head">
    <h3 id="notifTitle">الإشعارات</h3>
    <button class="btn btn-icon btn-ghost btn-sm" data-action="close-notifications" aria-label="إغلاق" type="button">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  </div>
  <div class="drawer-body" id="notificationsBody">
    <div class="load-more"><div class="spinner"></div></div>
  </div>
</aside>
