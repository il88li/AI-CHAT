<!-- ═══════════════════════════════════════════════════════════
     EDIT PROFILE MODAL — متعدد الأقسام
     ═══════════════════════════════════════════════════════════ -->
<div class="scrim" id="editProfileModal" data-open="false" onclick="Auth.closeEditProfile(event)"
     role="dialog" aria-modal="true" aria-labelledby="editProfileTitle">
  <div class="modal modal-lg" onclick="event.stopPropagation()">

    <button class="modal-close" onclick="Auth.closeEditProfile()" aria-label="إغلاق" type="button">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>

    <div class="edit-profile-head">
      <h3 id="editProfileTitle">تعديل الملف الشخصي</h3>
      <p>حدّث معلوماتك الظاهرة للمبدعين الآخرين.</p>
    </div>

    <form id="editProfileForm" onsubmit="Profile.save(event)" novalidate>

      <!-- Avatar & Cover -->
      <div class="edit-media-row">
        <div class="edit-cover-preview" id="editCoverPreview" data-cover="aurora">
          <div class="profile-cover-pattern" aria-hidden="true"></div>
          <button type="button" class="edit-media-btn" onclick="Profile.pickCover()" aria-label="تغيير الغلاف">
            <i class="ph ph-camera" aria-hidden="true"></i>
          </button>
        </div>

        <div class="edit-avatar-preview">
          <img id="editAvatarImg" src="" alt="">
          <button type="button" class="edit-media-btn" onclick="Profile.pickAvatar()" aria-label="تغيير الصورة">
            <i class="ph ph-camera" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <!-- Cover presets -->
      <div class="field" id="coverPresetsField" hidden>
        <label>اختر غلافاً</label>
        <div class="cover-presets" id="coverPresets">
          <button type="button" class="cover-preset" data-cover="aurora" style="--c1:#22D3EE;--c2:#8B5CF6" aria-label="Aurora"></button>
          <button type="button" class="cover-preset" data-cover="sunset" style="--c1:#FBBF24;--c2:#FB7185" aria-label="Sunset"></button>
          <button type="button" class="cover-preset" data-cover="forest" style="--c1:#34D399;--c2:#22D3EE" aria-label="Forest"></button>
          <button type="button" class="cover-preset" data-cover="royal" style="--c1:#8B5CF6;--c2:#EC4899" aria-label="Royal"></button>
          <button type="button" class="cover-preset" data-cover="midnight" style="--c1:#1E1E2A;--c2:#0A0A0F" aria-label="Midnight"></button>
          <button type="button" class="cover-preset" data-cover="ocean" style="--c1:#0EA5E9;--c2:#22D3EE" aria-label="Ocean"></button>
        </div>
      </div>

      <!-- Basic Info -->
      <div class="field">
        <label for="epName">الاسم الكامل</label>
        <input class="input" id="epName" type="text" required minlength="2" maxlength="80" placeholder="مثال: ميّادة التونسي">
      </div>

      <div class="field">
        <label for="epBio">نبذة</label>
        <textarea class="textarea" id="epBio" maxlength="300" rows="3"
                  style="font-family:var(--font-sans);direction:rtl;text-align:right;min-height:80px;font-size:15px"
                  placeholder="اكتب نبذة قصيرة عنك…"></textarea>
        <div class="field-hint">
          <span id="epBioCount">0</span> / 300
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="epLocation">الموقع</label>
          <input class="input" id="epLocation" type="text" maxlength="60" placeholder="مثال: الرياض">
        </div>
        <div class="field">
          <label for="epWebsite">الموقع الإلكتروني</label>
          <input class="input" id="epWebsite" type="url" maxlength="120" placeholder="https://…" inputmode="url">
        </div>
      </div>

      <div class="field">
        <label for="epAvatarUrl">رابط الصورة الرمزية (اختياري)</label>
        <input class="input" id="epAvatarUrl" type="url" placeholder="https://…" inputmode="url">
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="Auth.closeEditProfile()">إلغاء</button>
        <button type="submit" class="btn btn-primary" id="editProfileSubmit">
          <i class="ph ph-check" aria-hidden="true"></i>
          <span>حفظ التعديلات</span>
        </button>
      </div>

    </form>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     FOLLOWERS / FOLLOWING DRAWER
     ═══════════════════════════════════════════════════════════ -->
<div class="drawer-scrim" id="followersScrim" data-open="false" onclick="Profile.closeFollowers()" aria-hidden="true"></div>
<aside class="drawer" id="followersDrawer" data-open="false"
       role="dialog" aria-modal="true" aria-labelledby="followersTitle">
  <div class="drawer-head">
    <h3 id="followersTitle">المتابعون</h3>
    <button class="btn btn-icon btn-ghost btn-sm" onclick="Profile.closeFollowers()" aria-label="إغلاق" type="button">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
  </div>
  <div class="drawer-body" id="followersBody">
    <div class="empty-block">
      <i class="ph ph-circle-notch" style="animation:spin .8s linear infinite"></i>
    </div>
  </div>
</aside>

<!-- Hidden file inputs -->
<input type="file" id="avatarFileInput" accept="image/*" hidden>
<input type="file" id="coverFileInput" accept="image/*" hidden>
