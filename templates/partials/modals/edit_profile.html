<div class="scrim" id="editProfileModal" data-open="false" onclick="Auth.closeEditProfile(event)"
     role="dialog" aria-modal="true" aria-labelledby="editProfileTitle">
  <div class="modal" onclick="event.stopPropagation()">

    <button class="modal-close" onclick="Auth.closeEditProfile()" aria-label="إغلاق" type="button">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>

    <h3 id="editProfileTitle">تعديل الملف</h3>
    <p>حدّث معلوماتك الظاهرة للآخرين.</p>

    <form onsubmit="Auth.saveProfile(event)" novalidate>
      <div class="field">
        <label for="epName">الاسم</label>
        <input class="input" id="epName" type="text" required maxlength="80">
      </div>

      <div class="field">
        <label for="epBio">النبذة</label>
        <textarea class="textarea" id="epBio" maxlength="300"
                  style="font-family:var(--font-sans);direction:rtl;text-align:right;min-height:80px"></textarea>
      </div>

      <div class="field">
        <label for="epAvatar">رابط الصورة الرمزية</label>
        <input class="input" id="epAvatar" type="url" placeholder="https://…" inputmode="url">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="Auth.closeEditProfile()">إلغاء</button>
        <button type="submit" class="btn btn-primary">
          <i class="ph ph-check" aria-hidden="true"></i>
          حفظ
        </button>
      </div>
    </form>

  </div>
</div>
