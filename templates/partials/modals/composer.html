<div class="scrim sheet-scrim" id="composerModal" data-open="false" onclick="Composer.close(event)" role="dialog" aria-modal="true" aria-labelledby="composerTitle">
  <div class="sheet" onclick="event.stopPropagation()">

    <div class="sheet-handle" aria-hidden="true"></div>

    <div class="sheet-head">
      <h3 id="composerTitle">إنشاء منشور</h3>
      <button class="btn btn-icon btn-ghost btn-sm" onclick="Composer.close()" aria-label="إغلاق" type="button">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>

    <div class="composer-types" id="composerTypes">
      <button type="button" class="type-card" data-type="text" onclick="Composer.chooseType('text')">
        <span class="type-card-icon" data-kind="text">
          <i class="ph ph-text-aa" aria-hidden="true"></i>
        </span>
        <span class="type-card-label">منشور نصي</span>
      </button>

      <button type="button" class="type-card" data-type="prompt" onclick="Composer.chooseType('prompt')">
        <span class="type-card-icon" data-kind="prompt">
          <i class="ph ph-image" aria-hidden="true"></i>
        </span>
        <span class="type-card-label">صورة + برومبت</span>
      </button>
    </div>

    <form class="composer-form" id="composerForm" onsubmit="Composer.publish(event)" novalidate>

      <div class="composer-user">
        <img class="avatar" id="composerFormAvatar" src="" alt="">
        <div>
          <strong id="composerUserName">—</strong>
          <span class="composer-visibility">
            <i class="ph ph-globe" aria-hidden="true"></i> عام
          </span>
        </div>
      </div>

      <div class="field">
        <label for="cTitle" class="sr-only">عنوان المنشور</label>
        <input
          class="input"
          id="cTitle"
          type="text"
          placeholder="عنوان المنشور…"
          maxlength="200"
          autocomplete="off"
          required>
      </div>

      <div class="field">
        <label for="cPrompt" class="sr-only">نص البرومبت</label>
        <textarea
          class="textarea"
          id="cPrompt"
          placeholder="اكتب برومبتك هنا…"
          maxlength="2000"
          rows="5"
          autocomplete="off"
          spellcheck="false"
          required></textarea>
      </div>

      <div class="field" id="imageField" hidden>
        <label for="cImage">رابط الصورة</label>
        <div class="input-wrap">
          <i class="ph ph-link input-icon" aria-hidden="true"></i>
          <input
            class="input"
            id="cImage"
            type="url"
            placeholder="https://…"
            inputmode="url"
            autocomplete="off"
            oninput="Composer.previewImage(this.value)">
        </div>
        <div class="composer-img-preview" id="imgPreview" hidden>
          <img id="imgPreviewEl" alt="معاينة الصورة" loading="lazy">
          <button type="button" class="composer-img-clear" onclick="Composer.clearPreview()" aria-label="إزالة الصورة">
            <i class="ph ph-x" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="composer-row">
        <div class="field">
          <label for="cModel">الموديل</label>
          <select class="input" id="cModel">
            <option>Midjourney v6</option>
            <option>DALL·E 3</option>
            <option>Stable Diffusion XL</option>
            <option>Flux 1.1 Pro</option>
            <option>Adobe Firefly</option>
            <option>Leonardo AI</option>
            <option>Ideogram</option>
          </select>
        </div>
        <div class="field">
          <label for="cTags">الوسوم</label>
          <input
            class="input"
            id="cTags"
            type="text"
            placeholder="بورتريه، سينمائي"
            autocomplete="off">
        </div>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" id="composerSubmit">
        <i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>
        <span>نشر</span>
      </button>

    </form>

  </div>
</div>
