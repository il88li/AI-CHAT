<div class="scrim" id="authModal" data-open="false"
     onclick="Auth.close(event)"
     role="dialog"
     aria-modal="true"
     aria-labelledby="authTitle">

  <div class="auth-shell" onclick="event.stopPropagation()">

    <!-- ═══════════ Form Panel (right in RTL) ═══════════ -->
    <div class="auth-form-panel">

      <button class="auth-close"
              data-action="close-auth"
              aria-label="إغلاق"
              type="button">
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>

      <div class="auth-form-body">

        <header class="auth-header">
          <h1 id="authTitle">تسجيل الدخول</h1>
          <p id="authSub">أهلاً بعودتك إلى خَيال</p>
        </header>

        <!-- Tabs — pill-in-pill (matches sort-tabs) -->
        <div class="auth-tabs" data-mode="login" role="tablist" aria-label="نوع الدخول">
          <button class="auth-tab"
                  role="tab"
                  aria-selected="true"
                  data-mode="login"
                  data-action="switch-mode"
                  type="button">
            دخول
          </button>
          <button class="auth-tab"
                  role="tab"
                  aria-selected="false"
                  data-mode="register"
                  data-action="switch-mode"
                  type="button">
            حساب جديد
          </button>
        </div>

        <!-- Login Form -->
        <form class="auth-form is-active"
              id="loginForm"
              onsubmit="Auth.login(event)"
              autocomplete="on"
              novalidate>

          <div class="field">
            <label for="loginIdentifier">البريد أو اسم المستخدم</label>
            <div class="input-wrap">
              <i class="ph ph-user-circle input-icon" aria-hidden="true"></i>
              <input class="input"
                     id="loginIdentifier"
                     name="identifier"
                     type="text"
                     placeholder="you@example.com"
                     autocomplete="username"
                     autocapitalize="off"
                     spellcheck="false"
                     required>
            </div>
          </div>

          <div class="field">
            <label for="loginPassword">كلمة المرور</label>
            <div class="input-wrap">
              <i class="ph ph-lock input-icon" aria-hidden="true"></i>
              <input class="input"
                     id="loginPassword"
                     name="password"
                     type="password"
                     placeholder="••••••••"
                     autocomplete="current-password"
                     required
                     minlength="6">
              <span class="input-suffix">
                <button class="btn btn-icon btn-ghost btn-sm"
                        type="button"
                        onclick="Auth.togglePassword(this)"
                        aria-label="إظهار كلمة المرور">
                  <i class="ph ph-eye" aria-hidden="true"></i>
                </button>
              </span>
            </div>
          </div>

          <div class="auth-row-between">
            <label class="checkbox">
              <input type="checkbox" id="rememberMe" checked>
              <span class="checkbox-box" aria-hidden="true"></span>
              <span>تذكّرني</span>
            </label>
            <button type="button"
                    class="auth-link"
                    onclick="Auth.forgot(event)">
              نسيت كلمة المرور؟
            </button>
          </div>

          <button type="submit"
                  class="btn btn-primary auth-submit"
                  id="loginSubmit">
            <i class="ph ph-sign-in" aria-hidden="true"></i>
            <span>دخول</span>
          </button>

          <div class="auth-switch">
            ليس لديك حساب؟
            <button type="button"
                    data-action="switch-mode"
                    data-mode="register">
              أنشئ حساباً
            </button>
          </div>
        </form>

        <!-- Register Form -->
        <form class="auth-form"
              id="registerForm"
              onsubmit="Auth.register(event)"
              autocomplete="on"
              novalidate>

          <div class="field">
            <label for="regName">الاسم الكامل</label>
            <div class="input-wrap">
              <i class="ph ph-user input-icon" aria-hidden="true"></i>
              <input class="input"
                     id="regName"
                     name="name"
                     type="text"
                     placeholder="مثال: ميّادة التونسي"
                     autocomplete="name"
                     required
                     minlength="2"
                     maxlength="80">
            </div>
          </div>

          <div class="field">
            <label for="regUsername">اسم المستخدم</label>
            <div class="input-wrap">
              <i class="ph ph-at input-icon" aria-hidden="true"></i>
              <input class="input"
                     id="regUsername"
                     name="username"
                     type="text"
                     placeholder="mayada_t"
                     autocomplete="username"
                     autocapitalize="off"
                     spellcheck="false"
                     pattern="[a-zA-Z0-9_\-]{3,32}"
                     required
                     minlength="3"
                     maxlength="32"
                     aria-describedby="usernameHint">
              <span class="input-status" id="usernameStatus" aria-hidden="true"></span>
            </div>
            <div class="field-hint" id="usernameHint" style="direction:rtl;text-align:start">
              3-32 حرفاً إنجليزياً ·
              <span dir="ltr" style="font-family:var(--font-mono);color:var(--c-brand)">@username</span>
            </div>
          </div>

          <div class="field">
            <label for="regEmail">البريد الإلكتروني</label>
            <div class="input-wrap">
              <i class="ph ph-envelope input-icon" aria-hidden="true"></i>
              <input class="input"
                     id="regEmail"
                     name="email"
                     type="email"
                     placeholder="you@example.com"
                     autocomplete="email"
                     autocapitalize="off"
                     spellcheck="false"
                     required
                     maxlength="255">
              <span class="input-status" id="emailStatus" aria-hidden="true"></span>
            </div>
          </div>

          <div class="field">
            <label for="regPassword">كلمة المرور</label>
            <div class="input-wrap">
              <i class="ph ph-lock input-icon" aria-hidden="true"></i>
              <input class="input"
                     id="regPassword"
                     name="password"
                     type="password"
                     placeholder="6 أحرف على الأقل"
                     autocomplete="new-password"
                     required
                     minlength="6"
                     oninput="Auth.checkStrength(this.value)">
              <span class="input-suffix">
                <button class="btn btn-icon btn-ghost btn-sm"
                        type="button"
                        onclick="Auth.togglePassword(this)"
                        aria-label="إظهار كلمة المرور">
                  <i class="ph ph-eye" aria-hidden="true"></i>
                </button>
              </span>
            </div>
            <div class="pw-strength" data-level="0" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
          </div>

          <label class="checkbox">
            <input type="checkbox" id="agreeTerms" required>
            <span class="checkbox-box" aria-hidden="true"></span>
            <span>
              أوافق على
              <a href="/privacy"
                 target="_blank"
                 rel="noopener noreferrer"
                 style="color:var(--c-brand);font-weight:600">
                الشروط وسياسة الخصوصية
              </a>
            </span>
          </label>

          <button type="submit"
                  class="btn btn-primary auth-submit"
                  id="registerSubmit">
            <i class="ph ph-user-plus" aria-hidden="true"></i>
            <span>إنشاء الحساب</span>
          </button>

          <div class="auth-switch">
            لديك حساب بالفعل؟
            <button type="button"
                    data-action="switch-mode"
                    data-mode="login">
              سجّل دخولك
            </button>
          </div>
        </form>

      </div>
    </div>

    <!-- ═══════════ Brand Panel (left in RTL) ═══════════ -->
    <aside class="auth-brand-panel" aria-hidden="true">
      <div class="auth-brand-mark">خ</div>

      <div class="auth-brand-copy">
        <h2>شارِك البرومبت، لا الصورة فقط.</h2>
        <p>منصة عربية لمبدعي الصور بالذكاء الاصطناعي.</p>
      </div>

      <ul class="auth-brand-points">
        <li>
          <i class="ph ph-image-square"></i>
          <span>انشر برومبتاتك مع نتائجها</span>
        </li>
        <li>
          <i class="ph ph-users-three"></i>
          <span>تابع مبدعين من كل مكان</span>
        </li>
        <li>
          <i class="ph ph-bookmark-simple"></i>
          <span>احفظ واحتفظ بمكتبتك</span>
        </li>
      </ul>

      <div class="auth-brand-footer">
        <div class="auth-avatars-stack">
          <span></span><span></span><span></span>
        </div>
        <span>+12,000 مبدع عربي</span>
      </div>
    </aside>

  </div>
</div>
