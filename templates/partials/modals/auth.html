<div class="scrim" id="authModal" onclick="Auth.close(event)">
  <div class="auth-mini" onclick="event.stopPropagation()">

    <!-- رأس -->
    <div class="auth-mini-head">
      <div class="auth-mini-logo">خ</div>
      <button class="auth-mini-close" onclick="Auth.close()" aria-label="إغلاق">
        <i class="ph ph-x"></i>
      </button>
    </div>

    <!-- عنوان -->
    <h3 class="auth-mini-title" id="authMiniTitle">تسجيل الدخول</h3>
    <p class="auth-mini-sub" id="authMiniSub">أهلاً بعودتك إلى خَيال</p>

    <!-- نموذج الدخول -->
    <form class="auth-mini-form active" id="loginForm" onsubmit="Auth.login(event)">
      <div class="mini-field">
        <i class="ph ph-envelope"></i>
        <input type="text"
               id="loginIdentifier"
               placeholder="البريد أو اسم المستخدم"
               autocomplete="username"
               autocapitalize="off"
               spellcheck="false"
               required>
      </div>

      <div class="mini-field">
        <i class="ph ph-lock"></i>
        <input type="password"
               id="loginPassword"
               placeholder="كلمة المرور"
               autocomplete="current-password"
               required
               minlength="6">
        <button type="button" class="mini-eye" onclick="Auth.togglePassword(this)" aria-label="إظهار">
          <i class="ph ph-eye"></i>
        </button>
      </div>

      <button type="submit" class="mini-submit" id="loginSubmit">
        <span>دخول</span>
      </button>

      <div class="mini-switch">
        <span>ليس لديك حساب؟</span>
        <button type="button" onclick="Auth.switchMode('register')">سجّل الآن</button>
      </div>
    </form>

    <!-- نموذج التسجيل -->
    <form class="auth-mini-form" id="registerForm" onsubmit="Auth.register(event)">
      <div class="mini-field">
        <i class="ph ph-user"></i>
        <input type="text"
               id="regName"
               placeholder="الاسم الكامل"
               autocomplete="name"
               required
               minlength="2"
               maxlength="80">
      </div>

      <div class="mini-field">
        <i class="ph ph-at"></i>
        <input type="text"
               id="regUsername"
               placeholder="اسم المستخدم"
               autocomplete="username"
               autocapitalize="off"
               spellcheck="false"
               pattern="[a-zA-Z0-9_\-]{3,32}"
               required
               minlength="3"
               maxlength="32">
      </div>

      <div class="mini-field">
        <i class="ph ph-envelope"></i>
        <input type="email"
               id="regEmail"
               placeholder="البريد الإلكتروني"
               autocomplete="email"
               autocapitalize="off"
               spellcheck="false"
               required
               maxlength="255">
      </div>

      <div class="mini-field">
        <i class="ph ph-lock"></i>
        <input type="password"
               id="regPassword"
               placeholder="كلمة المرور (6+)"
               autocomplete="new-password"
               required
               minlength="6"
               oninput="Auth.checkStrength(this.value)">
        <button type="button" class="mini-eye" onclick="Auth.togglePassword(this)" aria-label="إظهار">
          <i class="ph ph-eye"></i>
        </button>
      </div>

      <div class="pw-strength" id="pwStrength" data-level="0">
        <span></span><span></span><span></span><span></span>
      </div>

      <button type="submit" class="mini-submit" id="registerSubmit">
        <span>إنشاء الحساب</span>
      </button>

      <div class="mini-switch">
        <span>لديك حساب؟</span>
        <button type="button" onclick="Auth.switchMode('login')">سجّل دخولك</button>
      </div>
    </form>

  </div>
</div>
