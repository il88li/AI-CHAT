<div class="view-overlay" id="editProfileView" hidden>

  <header class="view-overlay-head">
    <button class="btn btn-icon btn-ghost" data-action="close-edit-profile" aria-label="إغلاق" type="button">
      <i class="ph ph-x" aria-hidden="true"></i>
    </button>
    <h2>تعديل الملف</h2>
    <button class="btn btn-primary btn-sm" id="editProfileSubmit" data-action="save-profile" type="button">
      <i class="ph ph-check" aria-hidden="true"></i>
      <span>حفظ</span>
    </button>
  </header>

  <div class="view-overlay-body">
    <form id="editProfileForm" onsubmit="Profile.save(event)" novalidate>

      <!-- ═══ الغلاف والصورة ═══ -->
      <section class="edit-section">
        <h3 class="edit-section-title"><i class="ph ph-image"></i> الغلاف والصورة</h3>

        <div class="edit-media-row">
          <div class="edit-cover-preview" id="editCoverPreview" data-cover="aurora">
            <div class="profile-cover-pattern" aria-hidden="true"></div>
            <button type="button" class="edit-media-btn" data-action="pick-cover-file" aria-label="رفع صورة">
              <i class="ph ph-upload-simple"></i>
            </button>
          </div>
          <div class="edit-avatar-preview" id="editAvatarPreview">
            <img id="editAvatarImg" src="" alt="" data-frame="ring">
            <button type="button" class="edit-media-btn" data-action="pick-avatar-file" aria-label="رفع صورة">
              <i class="ph ph-upload-simple"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label>نمط الغلاف</label>
          <div class="cover-presets" id="coverPresets" role="radiogroup" aria-label="نمط الغلاف">
            <button type="button" class="cover-preset" data-cover="aurora"   aria-label="أورورا"          aria-pressed="false" style="--c1:#22D3EE;--c2:#8B5CF6"></button>
            <button type="button" class="cover-preset" data-cover="sunset"   aria-label="غروب"            aria-pressed="false" style="--c1:#FBBF24;--c2:#FB7185"></button>
            <button type="button" class="cover-preset" data-cover="forest"   aria-label="غابة"            aria-pressed="false" style="--c1:#34D399;--c2:#22D3EE"></button>
            <button type="button" class="cover-preset" data-cover="royal"    aria-label="ملكي"            aria-pressed="false" style="--c1:#8B5CF6;--c2:#EC4899"></button>
            <button type="button" class="cover-preset" data-cover="midnight" aria-label="منتصف الليل"     aria-pressed="false" style="--c1:#1E1E2A;--c2:#0A0A0F"></button>
            <button type="button" class="cover-preset" data-cover="ocean"    aria-label="محيط"            aria-pressed="false" style="--c1:#0EA5E9;--c2:#22D3EE"></button>
            <button type="button" class="cover-preset" data-cover="cyber"    aria-label="سايبر"           aria-pressed="false"></button>
            <button type="button" class="cover-preset" data-cover="candy"    aria-label="حلوى"            aria-pressed="false"></button>
            <button type="button" class="cover-preset" data-cover="mesh"     aria-label="شبكة ناعمة"      aria-pressed="false"></button>
            <button type="button" class="cover-preset" data-cover="noir"     aria-label="نوار"            aria-pressed="false"></button>
            <button type="button" class="cover-preset" data-cover="topo"     aria-label="طبوجرافيا"       aria-pressed="false"></button>
            <button type="button" class="cover-preset" data-cover="dots"     aria-label="نقاط"            aria-pressed="false"></button>
          </div>
        </div>

        <div class="field">
          <label>إطار الصورة الشخصية</label>
          <div class="frame-picker" id="avatarFramePicker" role="radiogroup" aria-label="إطار الصورة">
            <button type="button" class="frame-option" data-frame="none"     aria-pressed="false" aria-label="بلا إطار">
              <span class="frame-preview frame-preview--none" aria-hidden="true">خ</span>
              <span class="frame-label">بلا إطار</span>
            </button>
            <button type="button" class="frame-option" data-frame="ring"     aria-pressed="true"  aria-label="حلقة">
              <span class="frame-preview frame-preview--ring" aria-hidden="true">خ</span>
              <span class="frame-label">حلقة</span>
            </button>
            <button type="button" class="frame-option" data-frame="gradient" aria-pressed="false" aria-label="متدرج">
              <span class="frame-preview frame-preview--gradient" aria-hidden="true">خ</span>
              <span class="frame-label">متدرج</span>
            </button>
            <button type="button" class="frame-option" data-frame="neon"     aria-pressed="false" aria-label="نيون">
              <span class="frame-preview frame-preview--neon" aria-hidden="true">خ</span>
              <span class="frame-label">نيون</span>
            </button>
            <button type="button" class="frame-option" data-frame="double"   aria-pressed="false" aria-label="مزدوج">
              <span class="frame-preview frame-preview--double" aria-hidden="true">خ</span>
              <span class="frame-label">مزدوج</span>
            </button>
            <button type="button" class="frame-option" data-frame="polaroid" aria-pressed="false" aria-label="بولارويد">
              <span class="frame-preview frame-preview--polaroid" aria-hidden="true">خ</span>
              <span class="frame-label">بولارويد</span>
            </button>
            <button type="button" class="frame-option" data-frame="glass"    aria-pressed="false" aria-label="زجاجي">
              <span class="frame-preview frame-preview--glass" aria-hidden="true">خ</span>
              <span class="frame-label">زجاجي</span>
            </button>
            <button type="button" class="frame-option" data-frame="hex"      aria-pressed="false" aria-label="سُدَاسي">
              <span class="frame-preview frame-preview--hex" aria-hidden="true">خ</span>
              <span class="frame-label">سُدَاسي</span>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="epAvatarUrl">أو رابط الصورة الشخصية</label>
          <input class="input" id="epAvatarUrl" type="url" placeholder="https://…" inputmode="url">
        </div>
      </section>

      <!-- ═══ المعلومات ═══ -->
      <section class="edit-section">
        <h3 class="edit-section-title"><i class="ph ph-user"></i> المعلومات</h3>

        <div class="field">
          <label for="epName">الاسم الكامل</label>
          <input class="input" id="epName" type="text" required minlength="2" maxlength="80">
        </div>

        <div class="field">
          <label>الضمائر <span class="field-opt">(اختياري)</span></label>
          <div class="pronoun-picker" id="pronounPicker" role="radiogroup" aria-label="الضمائر">
            <button type="button" class="pronoun-option" data-pronoun="هو"      role="radio" aria-checked="false">هو</button>
            <button type="button" class="pronoun-option" data-pronoun="هي"      role="radio" aria-checked="false">هي</button>
            <button type="button" class="pronoun-option" data-pronoun="هم"      role="radio" aria-checked="false">هم</button>
            <button type="button" class="pronoun-option" data-pronoun="هن"      role="radio" aria-checked="false">هن</button>
            <button type="button" class="pronoun-option" data-pronoun=""        role="radio" aria-checked="true">لا تفضل</button>
          </div>
          <input type="hidden" id="epPronouns" value="">
        </div>

        <div class="field">
          <label for="epBio">نبذة</label>
          <textarea class="textarea" id="epBio" maxlength="300" rows="3"
                    style="font-family:var(--font-sans);direction:rtl;text-align:right;min-height:80px;font-size:15px"></textarea>
          <div class="field-hint"><span id="epBioCount">0</span> / 300</div>
        </div>

        <div class="field">
          <label for="epWebsite">الموقع الإلكتروني</label>
          <input class="input" id="epWebsite" type="url" maxlength="120" placeholder="https://…" inputmode="url">
        </div>
      </section>

      <!-- ═══ المظهر ═══ -->
      <section class="edit-section">
        <h3 class="edit-section-title"><i class="ph ph-palette"></i> المظهر</h3>

        <div class="field">
          <label>اللون المميز</label>
          <div class="accent-picker" id="accentPicker">
            <button type="button" class="accent-swatch" data-color="#22D3EE" style="--sw:#22D3EE" aria-pressed="true"></button>
            <button type="button" class="accent-swatch" data-color="#8B5CF6" style="--sw:#8B5CF6" aria-pressed="false"></button>
            <button type="button" class="accent-swatch" data-color="#FB7185" style="--sw:#FB7185" aria-pressed="false"></button>
            <button type="button" class="accent-swatch" data-color="#FBBF24" style="--sw:#FBBF24" aria-pressed="false"></button>
            <button type="button" class="accent-swatch" data-color="#34D399" style="--sw:#34D399" aria-pressed="false"></button>
            <button type="button" class="accent-swatch" data-color="#60A5FA" style="--sw:#60A5FA" aria-pressed="false"></button>
            <button type="button" class="accent-swatch" data-color="#F472B6" style="--sw:#F472B6" aria-pressed="false"></button>
            <button type="button" class="accent-swatch" data-color="#FAFAFA" style="--sw:#FAFAFA" aria-pressed="false"></button>
          </div>
        </div>

        <div class="field">
          <label>نمط البطاقة</label>
          <div class="style-picker" id="cardStylePicker">
            <button type="button" class="style-option" data-style="glass" aria-pressed="true">
              <span class="style-preview style-glass"></span>
              <span>زجاجي</span>
            </button>
            <button type="button" class="style-option" data-style="solid" aria-pressed="false">
              <span class="style-preview style-solid"></span>
              <span>صلب</span>
            </button>
            <button type="button" class="style-option" data-style="gradient" aria-pressed="false">
              <span class="style-preview style-gradient"></span>
              <span>متدرج</span>
            </button>
          </div>
        </div>
      </section>

    </form>
  </div>
</div>

<input type="file" id="avatarFileInput" accept="image/*" hidden>
<input type="file" id="coverFileInput" accept="image/*" hidden>

<script>
/* ─── Pronoun picker: keeps aria-checked + hidden input in sync ─── */
(function(){
  var picker = document.getElementById('pronounPicker');
  var hidden = document.getElementById('epPronouns');
  if (!picker || !hidden) return;
  picker.addEventListener('click', function(e){
    var btn = e.target.closest('.pronoun-option');
    if (!btn) return;
    picker.querySelectorAll('.pronoun-option').forEach(function(b){
      b.setAttribute('aria-checked', 'false');
    });
    btn.setAttribute('aria-checked', 'true');
    hidden.value = btn.dataset.pronoun || '';
  });
  /* preload current value when view opens */
  document.addEventListener('edit-profile:open', function(ev){
    var val = (ev.detail && ev.detail.pronouns) || '';
    var match = picker.querySelector('.pronoun-option[data-pronoun="' + val.replace(/"/g,'') + '"]')
             || picker.querySelector('.pronoun-option[data-pronoun=""]');
    picker.querySelectorAll('.pronoun-option').forEach(function(b){
      b.setAttribute('aria-checked', b === match ? 'true' : 'false');
    });
    hidden.value = match ? (match.dataset.pronoun || '') : '';
  });
})();
</script>
