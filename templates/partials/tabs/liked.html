<section class="tab-panel" id="tab-liked" data-tab="liked">

  <header class="feed-head">
    <div class="feed-head-text">
      <h1>المُعجَبة</h1>
      <p>كل ما وضعت عليه قلباً.</p>
    </div>
    <span class="counter" id="likedCount" data-count="0" aria-live="polite" aria-atomic="true">
      <i class="ph ph-heart-fill" aria-hidden="true"></i>
      <span data-count-label>0</span>
    </span>
  </header>

  <div class="feed" id="likedFeed" aria-busy="true">
    {% for i in range(3) %}
      {% include 'partials/cards/skeleton.html' %}
    {% endfor %}
  </div>

</section>
