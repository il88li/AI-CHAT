<section class="tab-panel" id="tab-profile" data-tab="profile">

  <!-- ═══ Skeleton ═══ -->
  <div class="profile-hero-skeleton" id="profileSkeleton" aria-hidden="true">
    <div class="profile-hero-cover"></div>
    <div class="profile-hero-avatar-wrap">
      <div class="profile-hero-avatar"></div>
    </div>
    <div class="profile-hero-body">
      <div class="sk-line lg"></div>
      <div class="sk-line md"></div>
      <div class="sk-line full"></div>
    </div>
  </div>

  <!-- ═══ Card ═══ -->
  <article class="profile-hero" id="profileCard" hidden>

    <!-- Cover -->
    <div class="profile-hero-cover" id="profileCover" data-cover="aurora">
      <div class="profile-hero-cover-pattern" aria-hidden="true"></div>

      <!-- Action button — يتغيّر حسب is_owner -->
      <button
        class="profile-hero-action"
        id="profileActionBtn"
        data-action="profile-action"
        data-variant="pill"
        data-state="idle"
        type="button"
        aria-label="متابعة">
        <i class="ph ph-plus" aria-hidden="true"></i>
        <span>متابعة</span>
      </button>
    </div>

    <!-- Avatar overlapping -->
    <div class="profile-hero-avatar-wrap">
      <img class="profile-hero-avatar" id="profileAvatar" src="" alt="" data-frame="ring">
    </div>

    <!-- Presence -->
    <div class="profile-hero-presence" id="profilePresence" data-online="true" hidden>
      <span class="profile-hero-presence-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </span>
      <span class="profile-hero-presence-label">متصل</span>
    </div>

    <!-- Body -->
    <div class="profile-hero-body">

      <h1 class="profile-hero-name">
        <span id="profileName">—</span>
        <i class="ph ph-seal-check" id="profileVerified" aria-label="موثّق" hidden></i>
      </h1>

      <div class="profile-hero-sub">
        <span class="profile-hero-handle" id="profileHandle">@—</span>
        <span class="profile-hero-pronouns" id="profilePronouns" hidden></span>
      </div>

      <p class="profile-hero-bio" id="profileBio"></p>

      <!-- Stats -->
      <div class="profile-hero-stats">
        <button
          class="profile-hero-stat"
          type="button"
          data-action="open-followers"
          aria-label="عرض المتابعين">
          <strong id="statFollowers">0</strong>
          <span>متابِع</span>
        </button>

        <span class="profile-hero-stat-div" aria-hidden="true"></span>

        <button
          class="profile-hero-stat"
          type="button"
          data-action="open-following"
          aria-label="عرض من يتابعهم">
          <strong id="statFollowing">0</strong>
          <span>يتابع</span>
        </button>

        <span class="profile-hero-stat-div" aria-hidden="true"></span>

        <div class="profile-hero-stat">
          <strong id="statPosts">0</strong>
          <span>برومبت</span>
        </div>

        <span class="profile-hero-stat-div" aria-hidden="true"></span>

        <div class="profile-hero-stat">
          <strong id="statLikes">0</strong>
          <span>إعجاب</span>
        </div>
      </div>

      <!-- Social row -->
      <div class="profile-hero-social">

        <button
          class="profile-hero-social-btn"
          type="button"
          data-action="share-profile"
          aria-label="مشاركة الملف">
          <i class="ph ph-share-network" aria-hidden="true"></i>
        </button>

        <button
          class="profile-hero-social-btn"
          type="button"
          data-action="copy-handle"
          aria-label="نسخ المعرّف">
          <i class="ph ph-link" aria-hidden="true"></i>
        </button>

        <button
          class="profile-hero-social-btn"
          type="button"
          data-action="message"
          aria-label="إرسال رسالة">
          <i class="ph ph-chat-circle" aria-hidden="true"></i>
        </button>

        <!-- للصاحب فقط: زر التعديل يظهر هنا -->
        <button
          class="profile-hero-social-btn"
          type="button"
          data-action="edit-profile"
          id="profileEditBtn"
          aria-label="تعديل الملف"
          hidden>
          <i class="ph ph-pencil-simple" aria-hidden="true"></i>
        </button>
      </div>

    </div>
  </article>

  <!-- ═══ Tabs — النظام الموحّد ═══ -->
  <div class="tabs-sticky">
    <nav
      class="profile-tabs ant-tabs-wrap ant-tabs-wrap--sub"
      id="profileTabs"
      role="tablist"
      aria-label="أقسام الملف"
      hidden>
      <button class="tab ant-tab" role="tab" aria-selected="true" data-ptab="posts" type="button">
        <i class="ph ph-image-square" aria-hidden="true"></i><span>البرومبتات</span>
      </button>
      <button class="tab ant-tab" role="tab" aria-selected="false" data-ptab="liked" type="button">
        <i class="ph ph-heart" aria-hidden="true"></i><span>المُعجَبة</span>
      </button>
      <button class="tab ant-tab" role="tab" aria-selected="false" data-ptab="saved" type="button" id="profileSavedTab">
        <i class="ph ph-bookmark-simple" aria-hidden="true"></i><span>المحفوظة</span>
      </button>
      <button class="tab ant-tab" role="tab" aria-selected="false" data-ptab="about" type="button">
        <i class="ph ph-info" aria-hidden="true"></i><span>نبذة</span>
      </button>
      <button class="tab ant-tab" role="tab" aria-selected="false" data-ptab="settings" type="button" id="profileSettingsTab">
        <i class="ph ph-gear" aria-hidden="true"></i><span>الإعدادات</span>
      </button>
    </nav>
  </div>

  <div id="profilePanel" class="profile-panel"></div>

</section>
