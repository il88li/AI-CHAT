<section class="tab-panel is-active" id="tab-home" data-tab="home">
  <div class="page-head">
    <div class="page-head-info">
      <h1>الرئيسية</h1>
      <p>أحدث البرومبتات من المنصة.</p>
    </div>
    <button class="btn btn-icon btn-secondary" onclick="App.refreshAll(true)" aria-label="تحديث" type="button">
      <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
    </button>
  </div>

  <div class="composer-trigger" onclick="Composer.open()" role="button" tabindex="0">
    <img class="avatar" id="composerAvatar" src="" alt="">
    <div class="composer-trigger-input">شارك برومبتاً جديداً…</div>
  </div>

  <div class="sort-row">
    <div class="sort-tabs" role="tablist" aria-label="ترتيب">
      <button class="sort-tab" role="tab" aria-selected="true" data-sort="recent" onclick="App.setSort('recent')" type="button">
        <i class="ph ph-clock" aria-hidden="true"></i> الأحدث
      </button>
      <button class="sort-tab" role="tab" aria-selected="false" data-sort="top" onclick="App.setSort('top')" type="button">
        <i class="ph ph-fire" aria-hidden="true"></i> الأكثر رواجاً
      </button>
    </div>
  </div>

  <div class="filters" id="filters" role="tablist" aria-label="تصفية"></div>

  <div class="feed" id="homeFeed" aria-busy="true">
    {% for i in range(6) %}
      {% include 'partials/cards/skeleton.html' %}
    {% endfor %}
  </div>

  <div id="homeLoader" class="text-center text-muted" style="padding:var(--sp-6);display:none">
    <i class="ph ph-circle-notch" style="animation:spin .8s linear infinite;display:inline-block" aria-hidden="true"></i>
    <span>جارٍ التحميل…</span>
  </div>
</section>
