<section class="tab-panel" id="tab-saved" data-tab="saved">

  <header class="feed-head">
    <div class="feed-head-text">
      <h1>المحفوظة</h1>
      <p>مكتبتك الشخصية للرجوع إليها.</p>
    </div>
    <span class="counter" id="savedCount" data-count="0" aria-live="polite" aria-atomic="true">
      <i class="ph ph-bookmark-simple-fill" aria-hidden="true"></i>
      <span data-count-label>0</span>
    </span>
  </header>

  <div class="feed" id="savedFeed" aria-busy="true">
    {% for i in range(3) %}
      {% include 'partials/cards/skeleton.html' %}
    {% endfor %}
  </div>

</section>
