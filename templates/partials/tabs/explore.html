<section class="tab-panel" id="tab-explore" data-tab="explore">
  <div class="page-head">
    <div class="page-head-info">
      <h1>استكشف</h1>
      <p>الأكثر رواجاً عبر المنصة.</p>
    </div>
  </div>

  <div class="collections" id="collections" role="list">
    <button class="collection" role="listitem" style="--c1:#22D3EE;--c2:#8B5CF6" onclick="Explore.openCollection('trending')" type="button">
      <div class="collection-inner">
        <i class="ph ph-fire" aria-hidden="true"></i>
        <h3>الأكثر رواجاً</h3>
        <p>برومبتات حصدت أعلى التفاعل هذا الأسبوع</p>
      </div>
    </button>

    <button class="collection" role="listitem" style="--c1:#FBBF24;--c2:#FB7185" onclick="Explore.openCollection('editor')" type="button">
      <div class="collection-inner">
        <i class="ph ph-sparkle" aria-hidden="true"></i>
        <h3>مختارات المحرر</h3>
        <p>برومبتات مختارة بعناية من الفريق</p>
      </div>
    </button>

    <button class="collection" role="listitem" style="--c1:#34D399;--c2:#22D3EE" onclick="Explore.openCollection('new')" type="button">
      <div class="collection-inner">
        <i class="ph ph-clock-clockwise" aria-hidden="true"></i>
        <h3>جديد اليوم</h3>
        <p>أحدث الإضافات خلال ٢٤ ساعة</p>
      </div>
    </button>
  </div>

  <div class="sort-row">
    <div class="sort-tabs" role="tablist" aria-label="ترتيب">
      <button class="sort-tab" role="tab" aria-selected="true" data-sort="recent" onclick="App.setSort('recent')" type="button">
        <i class="ph ph-clock" aria-hidden="true"></i> الأحدث
      </button>
      <button class="sort-tab" role="tab" aria-selected="false" data-sort="top" onclick="App.setSort('top')" type="button">
        <i class="ph ph-fire" aria-hidden="true"></i> الأكثر رواجاً
      </button>
    </div>
  </div>

  <div class="filters" id="exploreFilters" role="tablist" aria-label="تصفية الاستكشاف"></div>

  <div class="feed" id="exploreFeed" aria-busy="true">
    {% for i in range(6) %}
      {% include 'partials/cards/skeleton.html' %}
    {% endfor %}
  </div>
</section>
