<section class="tab-panel" id="tab-explore" data-tab="explore">

  <header class="feed-head">
    <div class="feed-head-text">
      <h1>استكشف</h1>
      <p>الأكثر رواجاً وإبداعاً عبر المنصة.</p>
    </div>
  </header>

  <div class="collections" id="collections" role="list">

    <button class="collection" role="listitem"
            style="--c1: #22D3EE; --c2: #8B5CF6;"
            onclick="Explore.openCollection('trending')"
            type="button">
      <span class="collection-icon" aria-hidden="true">
        <i class="ph ph-fire"></i>
      </span>
      <span class="collection-body">
        <span class="collection-title">الأكثر رواجاً</span>
        <span class="collection-desc">برومبتات حصدت أعلى التفاعل هذا الأسبوع</span>
      </span>
      <span class="collection-arrow" aria-hidden="true">
        <i class="ph ph-arrow-left"></i>
      </span>
    </button>

    <button class="collection" role="listitem"
            style="--c1: #FBBF24; --c2: #FB7185;"
            onclick="Explore.openCollection('editor')"
            type="button">
      <span class="collection-icon" aria-hidden="true">
        <i class="ph ph-sparkle"></i>
      </span>
      <span class="collection-body">
        <span class="collection-title">مختارات المحرر</span>
        <span class="collection-desc">برومبتات مختارة بعناية من الفريق</span>
      </span>
      <span class="collection-arrow" aria-hidden="true">
        <i class="ph ph-arrow-left"></i>
      </span>
    </button>

    <button class="collection" role="listitem"
            style="--c1: #34D399; --c2: #22D3EE;"
            onclick="Explore.openCollection('new')"
            type="button">
      <span class="collection-icon" aria-hidden="true">
        <i class="ph ph-clock-clockwise"></i>
      </span>
      <span class="collection-body">
        <span class="collection-title">جديد اليوم</span>
        <span class="collection-desc">أحدث الإضافات خلال ٢٤ ساعة</span>
      </span>
      <span class="collection-arrow" aria-hidden="true">
        <i class="ph ph-arrow-left"></i>
      </span>
    </button>

  </div>

  <div class="feed-toolbar">
    <div class="sort-tabs" role="tablist" aria-label="ترتيب الاستكشاف">
      <button class="sort-tab"
              role="tab"
              aria-selected="true"
              data-sort="recent"
              onclick="App.setSort('recent')"
              type="button">
        <i class="ph ph-clock" aria-hidden="true"></i>
        <span>الأحدث</span>
      </button>
      <button class="sort-tab"
              role="tab"
              aria-selected="false"
              data-sort="top"
              onclick="App.setSort('top')"
              type="button">
        <i class="ph ph-fire" aria-hidden="true"></i>
        <span>الأكثر رواجاً</span>
      </button>
    </div>
  </div>

  <div class="filters" id="exploreFilters" role="tablist" aria-label="تصفية الاستكشاف"></div>

  <div class="feed" id="exploreFeed" aria-busy="true">
    {% for i in range(6) %}
      {% include 'partials/cards/skeleton.html' %}
    {% endfor %}
  </div>

</section>
